project_root: .
input_csv: machine_measurements.csv
waveform_index: waveform_index.csv
artifacts_dir: artifacts
output_dir: outputs/model_1_ecg_only
label_mapping_path: artifacts/label_mapping.yaml
shared_labels_path: artifacts/labels.csv
shared_split_path: artifacts/patient_split_manifest.csv
random_seed: 42

data:
  sampling_frequency: 500
  n_leads: 12
  duration_seconds: 10
  waveform_format: wfdb_or_npz
  working_cohort_max_studies: 8000

preprocessing:
  normalization: train_lead_zscore
  clip_value: 8.0

model:
  channels: [32, 64, 128]
  kernels: [15, 9, 7]
  dropout: 0.3
  num_labels: 5

training:
  batch_size: 16
  max_epochs: 12
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 3
  num_workers: 0

thresholds:
  strategy: per_label_f1
  fallback: 0.5
  min_val_positives: 5

explainability:
  n_examples: 8
  integrated_steps: 16

smoke:
  n_studies: 60
  n_samples: 5000
